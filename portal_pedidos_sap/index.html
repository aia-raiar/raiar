<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Pedidos SAP — Raiar Orgânicos</title>

<!-- MSAL (autenticação Azure AD) -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/dist/msal-browser.min.js"></script>
<!-- SheetJS (leitura/exportação de Excel) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  :root{
    --marinho:#254D69;
    --marinho-escuro:#1a3a50;
    --azul:#5CDCF2;
    --rosa:#FFA385;
    --amarelo:#FFD043;
    --terra:#F2A15E;
    --cinza-bg:#F4F6F8;
    --cinza-borda:#DDE3E8;
    --cinza-texto:#4A5560;
    --linha-par:#F7F9FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    background:var(--cinza-bg);
    color:#2A2F35;
  }
  header.top{
    background:var(--marinho);
    color:#fff;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header.top .brand{
    display:flex;
    flex-direction:column;
    line-height:1.2;
  }
  header.top .brand .tag{
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--azul);
    text-transform:uppercase;
  }
  header.top .brand .title{
    font-size:18px;
    font-weight:bold;
  }
  #authArea{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:6px;
    padding:8px 14px;
    font-size:13px;
    font-weight:bold;
  }
  .btn-primary{background:var(--azul);color:var(--marinho-escuro);}
  .btn-primary:hover{background:#48c8e0;}
  .btn-secondary{background:#fff;color:var(--marinho);border:1px solid var(--cinza-borda);}
  .btn-secondary:hover{background:var(--cinza-bg);}
  .btn-danger{background:var(--rosa);color:#5a2a1c;}

  main{padding:16px 20px 60px;max-width:1500px;margin:0 auto;}

  #statusPanel{
    background:#fff;
    border:1px solid var(--cinza-borda);
    border-left:4px solid var(--azul);
    border-radius:6px;
    padding:16px;
    margin-bottom:16px;
    font-size:14px;
  }
  #statusPanel.erro{border-left-color:var(--rosa);color:#8a3b28;}
  #statusPanel.ok{border-left-color:#4CAF50;}

  .filtros{
    background:#fff;
    border:1px solid var(--cinza-borda);
    border-radius:8px;
    padding:16px;
    margin-bottom:16px;
    display:none;
  }
  .filtros h3{
    margin:0 0 12px;
    color:var(--marinho);
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.5px;
    border-bottom:2px solid var(--marinho);
    padding-bottom:6px;
  }
  .filtros-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
    gap:12px;
  }
  .campo-filtro label{
    display:block;
    font-size:11px;
    font-weight:bold;
    color:var(--cinza-texto);
    text-transform:uppercase;
    letter-spacing:.4px;
    margin-bottom:4px;
  }
  .campo-filtro input[type=text], .campo-filtro input[type=date]{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--cinza-borda);
    border-radius:5px;
    font-size:13px;
    font-family:inherit;
  }
  .multi-filtro{position:relative;}
  .multi-filtro-btn{
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid var(--cinza-borda);
    color:#2A2F35;
    border-radius:5px;
    padding:7px 8px;
    font-size:13px;
    font-weight:normal;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .multi-filtro-painel{
    display:none;
    position:absolute;
    z-index:50;
    top:105%;
    left:0;
    min-width:100%;
    max-height:260px;
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--cinza-borda);
    border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    padding:8px;
  }
  .multi-filtro-painel.aberto{display:block;}
  .multi-filtro-painel input[type=text]{
    width:100%;margin-bottom:6px;padding:6px;border:1px solid var(--cinza-borda);border-radius:4px;font-size:12px;
  }
  .multi-filtro-acoes{display:flex;gap:6px;margin-bottom:6px;}
  .multi-filtro-acoes a{font-size:11px;color:var(--marinho);cursor:pointer;text-decoration:underline;}
  .multi-filtro-item{display:flex;align-items:center;gap:6px;padding:3px 2px;font-size:12.5px;}
  .multi-filtro-item:hover{background:var(--cinza-bg);}

  .filtros-rodape{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    flex-wrap:wrap;
    gap:10px;
  }

  .resumo{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:10px;
    margin-bottom:16px;
  }
  .resumo .card{
    background:#fff;
    border:1px solid var(--cinza-borda);
    border-left:4px solid var(--terra);
    border-radius:6px;
    padding:10px 14px;
  }
  .resumo .card .lbl{font-size:11px;color:var(--cinza-texto);text-transform:uppercase;letter-spacing:.4px;}
  .resumo .card .val{font-size:20px;font-weight:bold;color:var(--marinho);}

  .tabela-wrap{
    background:#fff;
    border:1px solid var(--cinza-borda);
    border-radius:8px;
    overflow:auto;
    max-height:65vh;
  }
  table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap;}
  thead th{
    position:sticky;top:0;
    background:var(--marinho);
    color:#fff;
    padding:8px 10px;
    text-align:left;
    font-weight:normal;
    z-index:2;
  }
  tbody td{padding:6px 10px;border-bottom:1px solid var(--cinza-borda);}
  tbody tr:nth-child(even){background:var(--linha-par);}
  tbody tr:hover{background:#EAF6FA;}

  .rodape-tabela{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 4px;font-size:12px;color:var(--cinza-texto);
  }
  #hint{font-size:12px;color:var(--cinza-texto);margin-bottom:10px;}
  .spin{
    display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;
    border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="tag">Raiar Orgânicos</span>
    <span class="title">Portal de Pedidos SAP</span>
  </div>
  <div id="authArea">
    <button id="btnEntrar" class="btn-primary">Entrar com Microsoft</button>
  </div>
</header>

<main>
  <div id="statusPanel">Faça login com sua conta Microsoft (Raiar) para carregar a base de pedidos.</div>

  <div class="filtros" id="painelFiltros">
    <h3>Filtros</h3>
    <div class="filtros-grid" id="gridFiltros"></div>
    <div class="filtros-rodape">
      <div id="hint">Aplique ao menos um filtro ou clique em "Mostrar todos".</div>
      <div style="display:flex;gap:8px;">
        <button class="btn-secondary" id="btnLimpar">Limpar filtros</button>
        <button class="btn-secondary" id="btnMostrarTudo">Mostrar todos</button>
        <button class="btn-primary" id="btnExportar">Exportar Excel</button>
      </div>
    </div>
  </div>

  <div class="resumo" id="resumo" style="display:none;">
    <div class="card"><div class="lbl">Pedidos (distintos)</div><div class="val" id="resPedidos">0</div></div>
    <div class="card"><div class="lbl">Linhas de item</div><div class="val" id="resLinhas">0</div></div>
    <div class="card"><div class="lbl">Qtd. Total (itens)</div><div class="val" id="resQtd">0</div></div>
    <div class="card"><div class="lbl">Peso Total (Kg)</div><div class="val" id="resPeso">0</div></div>
    <div class="card"><div class="lbl">Receita Líquida (R$)</div><div class="val" id="resReceita">0</div></div>
  </div>

  <div class="tabela-wrap" id="tabelaWrap" style="display:none;">
    <table id="tabelaResultado">
      <thead><tr id="theadRow"></tr></thead>
      <tbody id="tbodyResultado"></tbody>
    </table>
  </div>
  <div class="rodape-tabela" id="rodapeTabela" style="display:none;"></div>
</main>

<script>
/* =========================================================
   CONFIGURAÇÃO — Azure AD / Microsoft Graph / SharePoint
   ========================================================= */
const CONFIG = {
  clientId: "538ecaea-c22a-4502-8f24-138199312916",
  tenantId: "6c305056-e26e-49fd-82f1-e9eb7cae3c4b",
  // >>> ATUALIZE esta URL para bater exatamente com a Redirect URI (SPA)
  //     cadastrada no App Registration do Azure AD, barra final incluída.
  //     O repositório se chama "raiar", então o GitHub Pages publica
  //     dentro de /raiar/ (não na raiz de aia-raiar.github.io).
  redirectUri: "https://aia-raiar.github.io/raiar/portal_pedidos_sap/",
  graphScopes: ["Files.Read.All"],
  // Link de compartilhamento do arquivo no SharePoint (visualização, org)
  sharedFileUrl: "https://organicosraiar.sharepoint.com/:x:/s/ControleseProcessos-RAIARORGNICOS/IQAdBciTLDdCR6zzmMquoOgHATMUiACsSgH6dU5S6H-3gpA?e=vhQyCc",
  sheetName: "f_Pedidos - SAP",
  headerRowIndex: 2 // linha 3 (0-based) contém os nomes das colunas
};

/* =========================================================
   MSAL — autenticação
   ========================================================= */
const msalConfig = {
  auth: {
    clientId: CONFIG.clientId,
    authority: "https://login.microsoftonline.com/" + CONFIG.tenantId,
    redirectUri: CONFIG.redirectUri
  },
  cache: { cacheLocation: "sessionStorage", storeAuthStateInCookie: false }
};
const msalInstance = new msal.PublicClientApplication(msalConfig);
let contaAtiva = null;

async function inicializarMsal(){
  await msalInstance.initialize();
  let resp = null;
  try{
    resp = await msalInstance.handleRedirectPromise();
  }catch(e){
    mostrarStatus("Falha ao concluir login: " + (e.errorMessage || e.message), "erro");
  }
  const contas = msalInstance.getAllAccounts();
  if (resp && resp.account){
    contaAtiva = resp.account;
  } else if (contas.length > 0){
    contaAtiva = contas[0];
  }
  if (contaAtiva){
    msalInstance.setActiveAccount(contaAtiva);
    atualizarAuthArea();
    await carregarBase();
  }
}

async function fazerLogin(){
  try{
    // loginRedirect é mais confiável que loginPopup em navegadores mobile,
    // onde pop-ups costumam ser bloqueados silenciosamente.
    await msalInstance.loginRedirect({ scopes: CONFIG.graphScopes });
  }catch(e){
    mostrarStatus("Falha ao iniciar login: " + (e.errorMessage || e.message), "erro");
  }
}

function fazerLogout(){
  msalInstance.logoutRedirect();
}

async function obterTokenGraph(){
  const request = { scopes: CONFIG.graphScopes, account: contaAtiva };
  try{
    const r = await msalInstance.acquireTokenSilent(request);
    return r.accessToken;
  }catch(e){
    // Fallback interativo via redirect (consistente com o login em mobile)
    await msalInstance.acquireTokenRedirect(request);
    return null; // a página será recarregada após o redirect
  }
}

function atualizarAuthArea(){
  const area = document.getElementById("authArea");
  const nome = contaAtiva?.name || contaAtiva?.username || "Usuário";
  area.innerHTML = "";
  const span = document.createElement("span");
  span.textContent = nome;
  const btn = document.createElement("button");
  btn.className = "btn-secondary";
  btn.textContent = "Sair";
  btn.onclick = fazerLogout;
  area.appendChild(span);
  area.appendChild(btn);
}

/* =========================================================
   Microsoft Graph — leitura do arquivo via link compartilhado
   ========================================================= */
function codificarLinkCompartilhado(url){
  let base64 = btoa(unescape(encodeURIComponent(url)));
  base64 = base64.replace(/=+$/, "").replace(/\//g, "_").replace(/\+/g, "-");
  return "u!" + base64;
}

async function baixarArquivoDoSharePoint(){
  const token = await obterTokenGraph();
  const shareId = codificarLinkCompartilhado(CONFIG.sharedFileUrl);
  const resp = await fetch(`https://graph.microsoft.com/v1.0/shares/${shareId}/driveItem/content`, {
    headers: { Authorization: "Bearer " + token }
  });
  if (!resp.ok){
    throw new Error("Graph API retornou " + resp.status + " ao buscar o arquivo.");
  }
  return await resp.arrayBuffer();
}

/* =========================================================
   Estado dos dados
   ========================================================= */
let baseCompleta = [];   // todas as linhas (objetos)
let baseFiltrada = [];   // após aplicar filtros
const filtrosMultiplos = {}; // nome do campo -> Set de selecionados
let mostrandoTudo = false;

const CAMPOS_MULTI = [
  { chave: "Vendedor", rotulo: "Vendedor" },
  { chave: "Utilização", rotulo: "Utilização" },
  { chave: "Status do Documento", rotulo: "Status" },
  { chave: "Empresa / Filial", rotulo: "Empresa/Filial" }
];
const CAMPOS_TEXTO = [
  { chave: "__cliente", rotulo: "Cliente (Razão/Fantasia)" },
  { chave: "__item", rotulo: "Item (Código/Descrição)" }
];
const CAMPOS_DATA = [
  { chave: "Data Expedição", rotulo: "Data Expedição" },
  { chave: "Data Entrega", rotulo: "Data Entrega" }
];

const COLUNAS_EXIBICAO = [
  "Vendedor","Nome PN","Nome Fantasia","CNPJ",
  "Nr. do Pedido SAP","Nr. Pedido Cliente","Utilização","Status do Documento",
  "Data Expedição","Data de Lançamento","Data Entrega",
  "Cód.Item","Descrição do item",
  "Quantidade","Quantidade por Embalagem","Quantidade Total","Peso",
  "Preço do Item","% de Desconto","Valor do Desconto","Preço com Desconto",
  "Endereço","Numero","Bairro","Cidade","Estado","CEP",
  "Empresa / Filial"
];

/* =========================================================
   Carregamento e parsing da base
   ========================================================= */
async function carregarBase(){
  mostrarStatus('<span class="spin"></span> Buscando arquivo no SharePoint...', "");
  try{
    const bytes = await baixarArquivoDoSharePoint();
    mostrarStatus('<span class="spin"></span> Lendo planilha...', "");
    const wb = XLSX.read(bytes, { type: "array", cellDates: true });
    const sheet = wb.Sheets[CONFIG.sheetName];
    if (!sheet) throw new Error('Aba "' + CONFIG.sheetName + '" não encontrada no arquivo.');
    const linhas = XLSX.utils.sheet_to_json(sheet, { range: CONFIG.headerRowIndex, defval: "" });
    baseCompleta = linhas.filter(l => (l["Nr. do Pedido SAP"] || l["Vendedor"] || l["Nome PN"]));
    baseCompleta.forEach(l => {
      l.__cliente = ((l["Nome PN"]||"") + " " + (l["Nome Fantasia"]||"")).toLowerCase();
      l.__item = ((l["Cód.Item"]||"") + " " + (l["Descrição do item"]||"")).toLowerCase();
    });
    mostrarStatus(baseCompleta.length + " linhas carregadas. Selecione filtros abaixo.", "ok");
    montarFiltros();
    document.getElementById("painelFiltros").style.display = "block";
  }catch(e){
    console.error(e);
    mostrarStatus("Erro ao carregar a base: " + e.message, "erro");
  }
}

function mostrarStatus(html, classe){
  const el = document.getElementById("statusPanel");
  el.innerHTML = html;
  el.className = classe || "";
}

/* =========================================================
   Construção dos filtros
   ========================================================= */
function valoresUnicos(campo){
  const s = new Set();
  baseCompleta.forEach(l => { const v = l[campo]; if (v !== undefined && v !== "") s.add(String(v)); });
  return Array.from(s).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

function montarFiltros(){
  const grid = document.getElementById("gridFiltros");
  grid.innerHTML = "";

  CAMPOS_MULTI.forEach(f => {
    filtrosMultiplos[f.chave] = new Set();
    const opcoes = valoresUnicos(f.chave);
    const div = document.createElement("div");
    div.className = "campo-filtro multi-filtro";
    div.innerHTML = `
      <label>${f.rotulo}</label>
      <button type="button" class="multi-filtro-btn" data-campo="${f.chave}">
        <span class="rotuloSel">Todos</span><span>▾</span>
      </button>
      <div class="multi-filtro-painel" data-painel="${f.chave}">
        <input type="text" placeholder="Buscar..." data-busca="${f.chave}">
        <div class="multi-filtro-acoes">
          <a data-acao="todos" data-campo="${f.chave}">Selecionar todos</a>
          <a data-acao="nenhum" data-campo="${f.chave}">Limpar</a>
        </div>
        <div class="lista-itens" data-lista="${f.chave}"></div>
      </div>`;
    grid.appendChild(div);
    preencherListaMulti(f.chave, opcoes);
  });

  CAMPOS_TEXTO.forEach(f => {
    const div = document.createElement("div");
    div.className = "campo-filtro";
    div.innerHTML = `<label>${f.rotulo}</label><input type="text" data-texto="${f.chave}" placeholder="Digite para buscar...">`;
    grid.appendChild(div);
  });

  CAMPOS_DATA.forEach(f => {
    const div = document.createElement("div");
    div.className = "campo-filtro";
    div.innerHTML = `<label>${f.rotulo} (de)</label><input type="date" data-data-de="${f.chave}">
                      <label style="margin-top:6px;">${f.rotulo} (até)</label><input type="date" data-data-ate="${f.chave}">`;
    grid.appendChild(div);
  });

  ligarEventosFiltros();
}

function preencherListaMulti(campo, opcoes){
  const lista = document.querySelector(`[data-lista="${campo}"]`);
  lista.innerHTML = opcoes.map(op => `
    <label class="multi-filtro-item">
      <input type="checkbox" value="${op.replace(/"/g,'&quot;')}" data-chk="${campo}"> ${op}
    </label>`).join("");
}

function ligarEventosFiltros(){
  // abrir/fechar painel multi-select
  document.querySelectorAll(".multi-filtro-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const campo = btn.dataset.campo;
      document.querySelectorAll(".multi-filtro-painel").forEach(p => {
        if (p.dataset.painel !== campo) p.classList.remove("aberto");
      });
      document.querySelector(`[data-painel="${campo}"]`).classList.toggle("aberto");
    });
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".multi-filtro")) {
      document.querySelectorAll(".multi-filtro-painel").forEach(p => p.classList.remove("aberto"));
    }
  });

  // busca dentro do painel
  document.querySelectorAll("[data-busca]").forEach(inp => {
    inp.addEventListener("input", () => {
      const campo = inp.dataset.busca;
      const termo = inp.value.toLowerCase();
      document.querySelectorAll(`[data-chk="${campo}"]`).forEach(chk => {
        chk.closest("label").style.display = chk.value.toLowerCase().includes(termo) ? "flex" : "none";
      });
    });
  });

  // selecionar todos / limpar
  document.querySelectorAll("[data-acao]").forEach(a => {
    a.addEventListener("click", () => {
      const campo = a.dataset.campo;
      const marcar = a.dataset.acao === "todos";
      document.querySelectorAll(`[data-chk="${campo}"]`).forEach(chk => chk.checked = marcar);
      atualizarSelecaoMulti(campo);
    });
  });

  // checkboxes
  document.querySelectorAll("[data-chk]").forEach(chk => {
    chk.addEventListener("change", () => atualizarSelecaoMulti(chk.dataset.chk));
  });

  // campos texto e data
  document.querySelectorAll("[data-texto]").forEach(inp => inp.addEventListener("input", aplicarFiltros));
  document.querySelectorAll("[data-data-de], [data-data-ate]").forEach(inp => inp.addEventListener("change", aplicarFiltros));
}

function atualizarSelecaoMulti(campo){
  const selecionados = new Set();
  document.querySelectorAll(`[data-chk="${campo}"]`).forEach(chk => { if (chk.checked) selecionados.add(chk.value); });
  filtrosMultiplos[campo] = selecionados;
  const btnRotulo = document.querySelector(`.multi-filtro-btn[data-campo="${campo}"] .rotuloSel`);
  btnRotulo.textContent = selecionados.size === 0 ? "Todos" : selecionados.size + " selecionado(s)";
  aplicarFiltros();
}

/* =========================================================
   Aplicação dos filtros
   ========================================================= */
function aplicarFiltros(){
  mostrandoTudo = false;
  const textoCliente = (document.querySelector('[data-texto="__cliente"]')?.value || "").toLowerCase();
  const textoItem = (document.querySelector('[data-texto="__item"]')?.value || "").toLowerCase();

  const datasDe = {}, datasAte = {};
  CAMPOS_DATA.forEach(f => {
    const de = document.querySelector(`[data-data-de="${f.chave}"]`)?.value;
    const ate = document.querySelector(`[data-data-ate="${f.chave}"]`)?.value;
    datasDe[f.chave] = de ? new Date(de + "T00:00:00") : null;
    datasAte[f.chave] = ate ? new Date(ate + "T23:59:59") : null;
  });

  const algumFiltroAtivo = Object.values(filtrosMultiplos).some(s => s.size > 0)
    || textoCliente || textoItem
    || Object.values(datasDe).some(d => d) || Object.values(datasAte).some(d => d);

  if (!algumFiltroAtivo){
    baseFiltrada = [];
    renderizarResultado(false);
    return;
  }

  baseFiltrada = baseCompleta.filter(l => {
    for (const f of CAMPOS_MULTI){
      const sel = filtrosMultiplos[f.chave];
      if (sel && sel.size > 0 && !sel.has(String(l[f.chave]))) return false;
    }
    if (textoCliente && !l.__cliente.includes(textoCliente)) return false;
    if (textoItem && !l.__item.includes(textoItem)) return false;
    for (const f of CAMPOS_DATA){
      const v = l[f.chave];
      const dv = v instanceof Date ? v : (v ? new Date(v) : null);
      if (datasDe[f.chave] && (!dv || dv < datasDe[f.chave])) return false;
      if (datasAte[f.chave] && (!dv || dv > datasAte[f.chave])) return false;
    }
    return true;
  });

  renderizarResultado(true);
}

function mostrarTodosOsPedidos(){
  mostrandoTudo = true;
  baseFiltrada = baseCompleta.slice();
  renderizarResultado(true);
}

/* =========================================================
   Renderização de resumo e tabela
   ========================================================= */
function formatarData(v){
  if (!(v instanceof Date) || isNaN(v)) return v || "";
  return v.toLocaleDateString("pt-BR");
}
function formatarNumero(n, casas){
  if (typeof n !== "number") { n = parseFloat(n); if (isNaN(n)) return ""; }
  return n.toLocaleString("pt-BR", { minimumFractionDigits: casas ?? 0, maximumFractionDigits: casas ?? 2 });
}

function renderizarResultado(temResultado){
  const resumo = document.getElementById("resumo");
  const tabelaWrap = document.getElementById("tabelaWrap");
  const rodape = document.getElementById("rodapeTabela");

  if (!temResultado){
    resumo.style.display = "none";
    tabelaWrap.style.display = "none";
    rodape.style.display = "none";
    return;
  }

  const pedidosDistintos = new Set(baseFiltrada.map(l => l["Nr. do Pedido SAP"])).size;
  const somaQtd = baseFiltrada.reduce((a,l)=>a+(parseFloat(l["Quantidade Total"])||0),0);
  const somaPeso = baseFiltrada.reduce((a,l)=>a+(parseFloat(l["Peso"])||0),0);
  const somaReceita = baseFiltrada.reduce((a,l)=>a+(parseFloat(l["Receita Líquida"])||0),0);

  document.getElementById("resPedidos").textContent = pedidosDistintos;
  document.getElementById("resLinhas").textContent = baseFiltrada.length;
  document.getElementById("resQtd").textContent = formatarNumero(somaQtd,0);
  document.getElementById("resPeso").textContent = formatarNumero(somaPeso,1);
  document.getElementById("resReceita").textContent = formatarNumero(somaReceita,2);
  resumo.style.display = "grid";

  const thead = document.getElementById("theadRow");
  thead.innerHTML = COLUNAS_EXIBICAO.map(c => `<th>${c}</th>`).join("");

  const tbody = document.getElementById("tbodyResultado");
  const LIMITE_RENDER = 1500;
  const linhasParaExibir = baseFiltrada.slice(0, LIMITE_RENDER);
  tbody.innerHTML = linhasParaExibir.map(l => {
    return "<tr>" + COLUNAS_EXIBICAO.map(c => {
      let v = l[c];
      if (v instanceof Date) v = formatarData(v);
      else if (typeof v === "number") v = formatarNumero(v, (c.includes("Preço")||c.includes("Desconto")||c==="Peso") ? 2 : 0);
      return `<td>${v ?? ""}</td>`;
    }).join("") + "</tr>";
  }).join("");

  tabelaWrap.style.display = "block";
  rodape.style.display = "flex";
  rodape.innerHTML = baseFiltrada.length > LIMITE_RENDER
    ? `Exibindo ${LIMITE_RENDER} de ${baseFiltrada.length} linhas (refine os filtros ou exporte para ver tudo).`
    : `Exibindo ${baseFiltrada.length} linha(s).`;
}

/* =========================================================
   Exportação para Excel
   ========================================================= */
function exportarExcel(){
  const dados = (baseFiltrada.length ? baseFiltrada : baseCompleta).map(l => {
    const obj = {};
    COLUNAS_EXIBICAO.forEach(c => {
      let v = l[c];
      if (v instanceof Date) v = formatarData(v);
      obj[c] = v ?? "";
    });
    return obj;
  });
  if (dados.length === 0){ alert("Nenhuma linha para exportar."); return; }
  const ws = XLSX.utils.json_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Pedidos Filtrados");
  const hoje = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `pedidos_sap_filtrado_${hoje}.xlsx`);
}

/* =========================================================
   Ligações finais de botões e inicialização
   ========================================================= */
document.getElementById("btnEntrar").addEventListener("click", fazerLogin);
document.getElementById("btnLimpar").addEventListener("click", () => {
  document.querySelectorAll('[data-chk]').forEach(c=>c.checked=false);
  CAMPOS_MULTI.forEach(f => { filtrosMultiplos[f.chave] = new Set();
    document.querySelector(`.multi-filtro-btn[data-campo="${f.chave}"] .rotuloSel`).textContent = "Todos"; });
  document.querySelectorAll('[data-texto]').forEach(i=>i.value="");
  document.querySelectorAll('[data-data-de], [data-data-ate]').forEach(i=>i.value="");
  aplicarFiltros();
});
document.getElementById("btnMostrarTudo").addEventListener("click", mostrarTodosOsPedidos);
document.getElementById("btnExportar").addEventListener("click", exportarExcel);

inicializarMsal();
</script>
